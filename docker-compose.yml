services:
  # Local/dev only. Production uses an existing Postgres (see docker-compose.prod.yml).
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - local-db
    volumes:
      - directus_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
      POSTGRES_DB: ${DB_DATABASE:-directus}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', '[ "$$(redis-cli ping)" = "PONG" ]']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  directus:
    image: directus/directus:11.9.2
    restart: unless-stopped
    ports:
      - '${DIRECTUS_PORT:-8055}:8055'
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
      - ./directus/snapshots:/directus/snapshots
    extra_hosts:
      # Allows DB_HOST=host.docker.internal when Postgres runs on the VPS host
      - 'host.docker.internal:host-gateway'
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8055/server/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      DB_CLIENT: pg
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus}
      CACHE_ENABLED: 'true'
      CACHE_AUTO_PURGE: 'true'
      CACHE_STORE: redis
      REDIS: redis://cache:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_CREDENTIALS: 'true'
      WEBSOCKETS_ENABLED: 'true'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      VITE_DIRECTUS_URL: ${VITE_DIRECTUS_URL:-http://localhost:8055}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      directus:
        condition: service_healthy

volumes:
  directus_pg_data:
  frontend_node_modules:
