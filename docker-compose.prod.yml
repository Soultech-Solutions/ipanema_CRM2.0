services:
  # Production API only — frontend is deployed separately.
  frontend:
    profiles:
      - frontend

  # Do not start the Compose Postgres — use the VPS existing database.
  database:
    profiles:
      - never

  directus:
    ports:
      - '${DIRECTUS_PORT:-8083}:8055'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://api-raca-comercial.soultech.solutions}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      DB_HOST: ${DB_HOST:?Set DB_HOST to your existing Postgres host}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PRESSURE_LIMITER_ENABLED: 'false'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      ANALISTA_MAX_TOOL_ROUNDS: ${ANALISTA_MAX_TOOL_ROUNDS:-6}
      ANALISTA_ENABLED: ${ANALISTA_ENABLED:-true}
